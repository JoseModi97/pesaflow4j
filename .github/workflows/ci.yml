name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gradle-build:
    name: Gradle build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pesaflow4j-spring-boot3-starter compiles at --release 17 (Spring
        # Boot 3 itself requires Java 17+), which needs a host JDK >= 17 to
        # cross-compile at all - so the full-reactor matrix starts at 17.
        # The Java 8 floor for the other modules is proven separately by the
        # jdk8-runtime-smoke-test job below, not by this matrix.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test every module
        run: ./gradlew build --console=plain

  gradle-plugin-build:
    name: Gradle plugin build (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install the main reactor to the local Maven repo
        # pesaflow4j-gradle-plugin is a separate, standalone Gradle build
        # (see PLAN.md SS4) - its test suite compile-verifies generated
        # examples against pesaflow4j-core/-servlet/-jakarta and both Spring
        # Boot starters, resolved from mavenLocal since this job's
        # perspective has no other way to see modules built by the
        # (separate) root Maven/Gradle reactor.
        run: mvn -B -DskipTests install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test pesaflow4j-gradle-plugin
        working-directory: pesaflow4j-gradle-plugin
        run: ./gradlew build --console=plain

  maven-build:
    name: Maven build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Java 17 floor as gradle-build, for the same reason
        # (pesaflow4j-spring-boot3-starter's maven.compiler.release=17).
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test every module
        run: mvn -B verify

  native-image-build:
    name: GraalVM native-image build (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the native binary
        run: ./gradlew :pesaflow4j-cli:nativeCompile --console=plain
      - name: Smoke-test the real binary
        run: |
          BIN=pesaflow4j-cli/build/native/nativeCompile/pesaflow4j
          "$BIN" checkout --client-id CID1 --api-key KEY1 --secret SECRET1 --service-id SID1 \
              --amount 500 --reference INV-0001 --description "School fees" \
              --name "Jane Doe" --id-number 12345678 --phone 0712345678 | tee /tmp/native-out.txt
          grep -q "secureHash = " /tmp/native-out.txt

  jdk8-runtime-smoke-test:
    name: Java 8 runtime smoke test
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar (release 8 bytecode)
        run: ./gradlew :pesaflow4j-core:jar --console=plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Run a smoke test directly on a Java 8 JVM
        run: |
          mkdir -p /tmp/smoke
          cat > /tmp/smoke/Smoke.java <<'EOF'
          import com.sun.net.httpserver.HttpServer;
          import io.github.josemodi97.pesaflow4j.Pesaflow4jClient;
          import io.github.josemodi97.pesaflow4j.Pesaflow4jConfig;
          import io.github.josemodi97.pesaflow4j.model.CheckoutRequest;
          import io.github.josemodi97.pesaflow4j.model.CheckoutResult;
          import io.github.josemodi97.pesaflow4j.model.PaymentSubmissionResult;
          import java.net.InetSocketAddress;
          import java.util.concurrent.atomic.AtomicReference;

          public class Smoke {
              public static void main(String[] args) throws Exception {
                  // Java 8 has no concept of multi-release jars at all, so it can
                  // only ever see the base (HttpURLConnection) entries - this is
                  // the real proof that the base variant alone is fully
                  // functional on its own, not just present in the jar.
                  if (!System.getProperty("java.version").startsWith("1.8")) {
                      throw new AssertionError("This job is meant to run on a real Java 8 JVM, got: " + System.getProperty("java.version"));
                  }

                  Pesaflow4jClient client = new Pesaflow4jClient(Pesaflow4jConfig.builder()
                          .apiClientId("CID").apiKey("KEY").secret("SECRET").serviceId("SID").build());
                  CheckoutResult result = client.checkout(CheckoutRequest.builder()
                          .amount(500).reference("INV-1").description("Test")
                          .name("Jane Doe").idNumber("12345678").build());
                  if (result.getPayload().get("secureHash") == null || result.getPayload().get("secureHash").isEmpty()) {
                      throw new AssertionError("Expected a non-empty secureHash on Java 8");
                  }

                  AtomicReference<String> capturedUserAgent = new AtomicReference<>("<none>");
                  HttpServer server = HttpServer.create(new InetSocketAddress("127.0.0.1", 0), 0);
                  server.createContext("/pay", exchange -> {
                      capturedUserAgent.set(exchange.getRequestHeaders().getFirst("User-Agent"));
                      byte[] body = "OK".getBytes();
                      exchange.sendResponseHeaders(200, body.length);
                      exchange.getResponseBody().write(body);
                      exchange.close();
                  });
                  server.start();
                  try {
                      String url = "http://127.0.0.1:" + server.getAddress().getPort() + "/pay";
                      Pesaflow4jClient liveClient = new Pesaflow4jClient(Pesaflow4jConfig.builder()
                              .apiClientId("CID").apiKey("KEY").secret("SECRET").serviceId("SID")
                              .gatewayUrl(url).build());
                      PaymentSubmissionResult submission = liveClient.initiatePayment(CheckoutRequest.builder()
                              .amount(500).reference("INV-2").description("Test")
                              .name("Jane Doe").idNumber("12345678").build());
                      if (submission.getHttpStatus() != 200) {
                          throw new AssertionError("Expected HTTP 200, got " + submission.getHttpStatus());
                      }
                      String userAgent = capturedUserAgent.get();
                      if (userAgent == null || !userAgent.startsWith("Java/")) {
                          throw new AssertionError("Expected the HttpURLConnection base variant's default User-Agent (Java/...), got: " + userAgent);
                      }
                      System.out.println("Confirmed base HttpURLConnection variant handled the request (User-Agent: " + userAgent + ")");
                  } finally {
                      server.stop(0);
                  }

                  System.out.println("PesaFlow4J core runs correctly on: " + System.getProperty("java.version"));
              }
          }
          EOF
          JAR=$(find pesaflow4j-core/build/libs -name 'pesaflow4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          javac -cp "$JAR" -d /tmp/smoke /tmp/smoke/Smoke.java
          java -cp "$JAR:/tmp/smoke" Smoke

  mrjar-smoke-test:
    name: Multi-release jar smoke test (JPMS + HttpClient variant)
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the multi-release jar
        run: ./gradlew :pesaflow4j-core:jar --console=plain
      - name: Validate multi-release API consistency
        run: |
          JAR=$(find pesaflow4j-core/build/libs -name 'pesaflow4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          jar --validate --file "$JAR"
      - name: Describe the module (proves the descriptor is well-formed)
        run: |
          JAR=$(find pesaflow4j-core/build/libs -name 'pesaflow4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          jar --file="$JAR" --describe-module --release 9 | tee /tmp/module-descriptor.txt
          grep -q "^exports io.github.josemodi97.pesaflow4j$" /tmp/module-descriptor.txt
          grep -q "^exports io.github.josemodi97.pesaflow4j.model$" /tmp/module-descriptor.txt
          grep -q "^exports io.github.josemodi97.pesaflow4j.exception$" /tmp/module-descriptor.txt
          grep -q "^exports io.github.josemodi97.pesaflow4j.util$" /tmp/module-descriptor.txt
          # .internal must stay encapsulated:
          if grep -q "internal" /tmp/module-descriptor.txt; then
            echo "internal package leaked into the module descriptor" >&2
            exit 1
          fi
      - name: Run on the real module path (not just the classpath)
        run: |
          mkdir -p /tmp/module-smoke
          JAR=$(find pesaflow4j-core/build/libs -name 'pesaflow4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          cat > /tmp/module-smoke/ModuleSmoke.java <<'EOF'
          import io.github.josemodi97.pesaflow4j.Pesaflow4jClient;
          import io.github.josemodi97.pesaflow4j.Pesaflow4jConfig;
          import io.github.josemodi97.pesaflow4j.model.CheckoutRequest;
          import io.github.josemodi97.pesaflow4j.model.CheckoutResult;

          public class ModuleSmoke {
              public static void main(String[] args) {
                  Module coreModule = Pesaflow4jClient.class.getModule();
                  if (!coreModule.isNamed()) {
                      throw new AssertionError("Expected pesaflow4j-core to be a NAMED module on the module path");
                  }
                  System.out.println("core module name: " + coreModule.getName());

                  Pesaflow4jClient client = new Pesaflow4jClient(Pesaflow4jConfig.builder()
                          .apiClientId("CID").apiKey("KEY").secret("SECRET").serviceId("SID").build());
                  CheckoutResult result = client.checkout(CheckoutRequest.builder()
                          .amount(500).reference("INV-1").description("Test")
                          .name("Jane Doe").idNumber("12345678").build());
                  if (result.getPayload().get("secureHash") == null || result.getPayload().get("secureHash").isEmpty()) {
                      throw new AssertionError("Expected a non-empty secureHash");
                  }
                  System.out.println("Module-path smoke test passed on Java " + System.getProperty("java.version"));
              }
          }
          EOF
          javac -cp "$JAR" -d /tmp/module-smoke /tmp/module-smoke/ModuleSmoke.java
          java --module-path "$JAR" --add-modules io.github.josemodi97.pesaflow4j.core -cp /tmp/module-smoke ModuleSmoke
      - name: Confirm the HttpClient variant (not HttpURLConnection) is used on Java 11+
        run: |
          mkdir -p /tmp/http-variant-smoke
          JAR=$(find pesaflow4j-core/build/libs -name 'pesaflow4j-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          cat > /tmp/http-variant-smoke/HttpVariantSmoke.java <<'EOF'
          import com.sun.net.httpserver.HttpServer;
          import io.github.josemodi97.pesaflow4j.Pesaflow4jClient;
          import io.github.josemodi97.pesaflow4j.Pesaflow4jConfig;
          import io.github.josemodi97.pesaflow4j.model.CheckoutRequest;
          import io.github.josemodi97.pesaflow4j.model.PaymentSubmissionResult;
          import java.net.InetSocketAddress;
          import java.util.concurrent.atomic.AtomicReference;

          public class HttpVariantSmoke {
              public static void main(String[] args) throws Exception {
                  AtomicReference<String> capturedUserAgent = new AtomicReference<>("<none>");
                  HttpServer server = HttpServer.create(new InetSocketAddress("127.0.0.1", 0), 0);
                  server.createContext("/pay", exchange -> {
                      capturedUserAgent.set(exchange.getRequestHeaders().getFirst("User-Agent"));
                      byte[] body = "OK".getBytes();
                      exchange.sendResponseHeaders(200, body.length);
                      exchange.getResponseBody().write(body);
                      exchange.close();
                  });
                  server.start();
                  try {
                      String url = "http://127.0.0.1:" + server.getAddress().getPort() + "/pay";
                      Pesaflow4jClient client = new Pesaflow4jClient(Pesaflow4jConfig.builder()
                              .apiClientId("CID").apiKey("KEY").secret("SECRET").serviceId("SID")
                              .gatewayUrl(url).build());
                      PaymentSubmissionResult result = client.initiatePayment(CheckoutRequest.builder()
                              .amount(500).reference("INV-1").description("Test")
                              .name("Jane Doe").idNumber("12345678").build());
                      if (result.getHttpStatus() != 200) {
                          throw new AssertionError("Expected HTTP 200, got " + result.getHttpStatus());
                      }
                      String userAgent = capturedUserAgent.get();
                      System.out.println("Observed User-Agent: " + userAgent);
                      if (userAgent == null || !userAgent.startsWith("Java-http-client/")) {
                          throw new AssertionError("Expected the java.net.http.HttpClient variant's User-Agent (Java-http-client/...) on Java 11+, got: " + userAgent);
                      }
                      System.out.println("Confirmed the Java 11+ HttpClient variant handled the request.");
                  } finally {
                      server.stop(0);
                  }
              }
          }
          EOF
          javac -cp "$JAR" -d /tmp/http-variant-smoke /tmp/http-variant-smoke/HttpVariantSmoke.java
          java -cp "$JAR:/tmp/http-variant-smoke" HttpVariantSmoke
