name: Release Gradle Plugin

# Template workflow: publishes pesaflow4j-gradle-plugin to the Gradle
# Plugin Portal (plugins.gradle.org) when a `vX.Y.Z` tag is pushed - the
# same tag release.yml uses for the Maven Central release, so both
# publish together from one `git tag vX.Y.Z && git push --tags`.
#
# Requires these repository secrets before this workflow can run for real
# (see PLAN.md "Publishing pesaflow4j-gradle-plugin" for how to obtain them):
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET - Plugin Portal API key pair
#   (Profile -> API Keys at https://plugins.gradle.org, after creating an
#   account and running the one-time website/CLI key-generation flow)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to the Gradle Plugin Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install the main reactor to the local Maven repo
        # pesaflow4j-gradle-plugin is a standalone build (see PLAN.md SS4);
        # its own build/test needs pesaflow4j-core et al. resolvable from
        # mavenLocal, same as the CI job in ci.yml.
        run: mvn -B -DskipTests install

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test at the tagged version
        working-directory: pesaflow4j-gradle-plugin
        run: ./gradlew build -PpesaflowVersion=${{ steps.version.outputs.version }} --console=plain

      - name: Publish to the Gradle Plugin Portal
        working-directory: pesaflow4j-gradle-plugin
        run: ./gradlew publishPlugins -PpesaflowVersion=${{ steps.version.outputs.version }} --console=plain
        env:
          ORG_GRADLE_PROJECT_gradle.publish.key: ${{ secrets.GRADLE_PUBLISH_KEY }}
          ORG_GRADLE_PROJECT_gradle.publish.secret: ${{ secrets.GRADLE_PUBLISH_SECRET }}
